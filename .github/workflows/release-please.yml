name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_tag:
        description: Optional immutable package tag to retry instead of running Release Please
        required: false
        type: string
        default: ''
      recover_release_pr:
        description: Merged release PR whose missing component releases should be completed
        required: false
        type: string
        default: ''
      recover_release_sha:
        description: Exact main-ancestor merge SHA of that release PR (required with recover_release_pr)
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    if: github.event_name == 'push' || inputs.target_tag == '' || inputs.recover_release_pr != '' || inputs.recover_release_sha != ''
    concurrency:
      group: console-release-creation
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      console_release_created: ${{ steps.components.outputs.release_created }}
      console_tag_name: ${{ steps.components.outputs.tag_name }}
      core_release_created: ${{ steps.components.outputs['console-core--release_created'] }}
      core_tag_name: ${{ steps.components.outputs['console-core--tag_name'] }}
      server_release_created: ${{ steps.components.outputs['console-server--release_created'] }}
      server_tag_name: ${{ steps.components.outputs['console-server--tag_name'] }}
      ui_release_created: ${{ steps.components.outputs['console-ui--release_created'] }}
      ui_tag_name: ${{ steps.components.outputs['console-ui--tag_name'] }}
    steps:
      - name: Validate release mode
        env:
          TARGET_TAG: ${{ inputs.target_tag }}
          RECOVER_RELEASE_PR: ${{ inputs.recover_release_pr }}
          RECOVER_RELEASE_SHA: ${{ inputs.recover_release_sha }}
        run: |
          if [ -n "${TARGET_TAG}" ] && { [ -n "${RECOVER_RELEASE_PR}" ] || [ -n "${RECOVER_RELEASE_SHA}" ]; }; then
            echo "Tag retry and component recovery are mutually exclusive." >&2
            exit 1
          fi

      - name: Checkout release policy
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install locked release tooling
        run: npm ci --no-fund --no-audit

      # Release PRs authored by the default GITHUB_TOKEN (github-actions[bot])
      # get their CI runs held as action_required on every refresh. Minting a
      # token from the org's kontour-release-bot app makes the app the PR
      # author, so CI runs unassisted. See kontourai/flow-agents#38.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Create component releases without reserializing merged notes
        id: components
        env:
          RELEASE_PLEASE_TOKEN: ${{ steps.app-token.outputs.token }}
          RECOVER_RELEASE_PR: ${{ inputs.recover_release_pr }}
          RECOVER_RELEASE_SHA: ${{ inputs.recover_release_sha }}
        run: node --import tsx scripts/create-component-releases.ts

      - name: Generate release-please pull request
        id: release
        if: inputs.recover_release_pr == '' && inputs.recover_release_sha == ''
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1, PR generation only
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  # npm trusted publishing validates the calling workflow for workflow_call.
  # Keep retries under this same top-level identity as automatic releases.
  retry-publish:
    if: github.event_name == 'workflow_dispatch' && inputs.target_tag != '' && inputs.recover_release_pr == '' && inputs.recover_release_sha == ''
    uses: ./.github/workflows/publish-npm.yml
    with:
      target_tag: ${{ inputs.target_tag }}
    permissions:
      contents: read
      id-token: write


  # Call the workflow definition from this main revision while package contents
  # remain authoritative at each immutable Release Please tag.
  publish-core:
    needs: release-please
    if: needs.release-please.outputs.core_release_created == 'true'
    uses: ./.github/workflows/publish-npm.yml
    with:
      target_tag: ${{ needs.release-please.outputs.core_tag_name }}
    permissions:
      contents: read
      id-token: write

  publish-console:
    needs: [release-please, publish-core]
    if: >-
      always() &&
      needs.release-please.result == 'success' &&
      needs.release-please.outputs.console_release_created == 'true' &&
      (needs.publish-core.result == 'success' || needs.publish-core.result == 'skipped')
    uses: ./.github/workflows/publish-npm.yml
    with:
      target_tag: ${{ needs.release-please.outputs.console_tag_name }}
    permissions:
      contents: read
      id-token: write

  publish-server:
    needs: [release-please, publish-core]
    if: >-
      always() &&
      needs.release-please.result == 'success' &&
      needs.release-please.outputs.server_release_created == 'true' &&
      (needs.publish-core.result == 'success' || needs.publish-core.result == 'skipped')
    uses: ./.github/workflows/publish-npm.yml
    with:
      target_tag: ${{ needs.release-please.outputs.server_tag_name }}
    permissions:
      contents: read
      id-token: write

  publish-console-ui:
    needs: [release-please, publish-core]
    if: >-
      always() &&
      needs.release-please.result == 'success' &&
      needs.release-please.outputs.ui_release_created == 'true' &&
      (needs.publish-core.result == 'success' || needs.publish-core.result == 'skipped')
    uses: ./.github/workflows/publish-npm.yml
    with:
      target_tag: ${{ needs.release-please.outputs.ui_tag_name }}
    permissions:
      contents: read
      id-token: write
